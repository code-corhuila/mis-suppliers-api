name: Suppliers checks
on:
  pull_request:
    branches: [develop, qa]
permissions:
  contents: read
concurrency:
  group: suppliers-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
